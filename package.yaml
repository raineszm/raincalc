name: raincalc
version: '0.1.0.0'
synopsis: A simple rpn calculator in Haskell.
category: Math
author: Zach Raines
maintainer: raineszm+raincalc@gmail.com
license: GPL-3
dependencies:
- base ==4.*
library:
  source-dirs: src/
  exposed-modules:
  - Math.RainCalc.Classes
  - Math.RainCalc.Command
  - Math.RainCalc.Computation
  - Math.RainCalc.Engine
  - Math.RainCalc.Modifier
  - Math.RainCalc.Numbers
  - Math.RainCalc.Operator
  - Math.RainCalc.Registers
  - Math.RainCalc.RPNState
  - Math.RainCalc.Utils
  dependencies:
  - containers
  - haskeline
  - mtl
  - regex-pcre-builtin
executables:
  raincalc:
    main: Main.hs
    source-dirs: src-exec/
    dependencies:
    - raincalc
tests:
  spec:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -Wall
    - -Werror
    dependencies:
    - raincalc
    - mtl
    - hspec >=1.3
    - QuickCheck >=2.0
